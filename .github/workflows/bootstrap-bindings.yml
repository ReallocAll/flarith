name: Bootstrap generated bindings
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/feat/r0-protobuf-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install grpcio-tools
      - run: python scripts/generate_proto.py
      - name: Commit generated Python bindings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/flarith/proto/spark/spark_pb2.py src/flarith/proto/spark/spark_sampler_pb2.py
          if ! git diff --cached --quiet; then
            git commit -m "build: commit pinned Spark Protobuf Python bindings"
            git push origin HEAD:feat/r0-protobuf-core
          fi
