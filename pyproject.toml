[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flarith"
version = "0.1.0"
description = "Spark Profile analysis for AI agents"
requires-python = ">=3.12"
dependencies = ["protobuf>=7.35.1,<8", "fastmcp>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "grpcio-tools==1.84.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
