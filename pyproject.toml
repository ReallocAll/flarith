[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flarith"
version = "0.1.0"
description = "Spark Profile analysis for AI agents"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["protobuf>=7.36.2,<8", "fastmcp==4.1.6"]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.4.1.post1,<2", "grpcio-tools==1.85.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
